<style>
:root{--accent:#8B1E2D;--paper:#F4F1EE;--ink:#1D1B19;--muted:#6B645E;--line:#DCD5CE;--card:#FFFFFF}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Noto Sans","Noto Sans Devanagari","Noto Sans KR",system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.5}
header{background:var(--accent);color:#fff;padding:16px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
header h1{margin:0;font-size:22px;font-weight:800}
header p{margin:0;opacity:.9}
.badge{margin-left:auto;font-size:12px;border:1px solid rgba(255,255,255,.7);border-radius:999px;padding:3px 10px}
main{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:20px;padding:20px;max-width:1280px;margin:0 auto}
@media (max-width:820px){main{grid-template-columns:1fr;padding:14px}.preview{order:-1}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h2{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:18px 0 8px}
.panel h2:first-child{margin-top:0}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px}
input[type=text],input[type=email],input[type=url],select{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=file]{font-size:13px;width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.samples{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.samples button{border:2px solid var(--line);border-radius:8px;padding:0;background:#fff;cursor:pointer;overflow:hidden}
.samples button.on{border-color:var(--accent)}
.samples canvas{width:100%;display:block}
.samples span{display:block;font-size:11px;padding:2px 0 4px}
.logos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.logos button{border:2px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;padding:6px 2px;font:inherit;font-size:11px;color:var(--ink)}
.logos button.on{border-color:var(--accent)}
.logos canvas{width:44px;height:44px;display:block;margin:0 auto 2px}
.preview{display:flex;flex-direction:column;gap:14px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:1100px){.cards{grid-template-columns:1fr}}
.cards figure{margin:0}
.cards figcaption{font-size:12px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em}
.cards canvas{width:100%;height:auto;display:block;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns button{font:inherit;font-weight:600;padding:9px 14px;border-radius:999px;border:1.5px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer}
.btns button.main{background:var(--accent);color:#fff}
#fallback{display:none;background:#fff;border:1px dashed var(--accent);border-radius:12px;padding:12px}
#fallback img{max-width:100%;display:block;margin-top:8px}
.note{font-size:13px;color:var(--muted)}
footer{text-align:center;font-size:13px;color:var(--muted);padding:10px 20px 28px}
.color-row{display:flex;gap:12px;align-items:center}
.color-row input[type=color]{width:48px;height:34px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff}
input[type=range]{width:100%}
</style>
</head>
<body>
<script>
/*__CFG_START__*/
var CFG = {
  studio: "Himal Cards",
  niche: "Nepali restaurants and shops in Seoul",
  language: "Nepali",
  accent: "#8B1E2D",
  sample: 1,
  font: "Noto Sans",
  card: {
    business: "Himal Kitchen",
    businessLocal: "हिमाल किचन",
    name: "Sita Rai",
    title: "Owner and Head Chef",
    mobile: "010-0000-0000",
    email: "hello@example.com",
    address: "Seoul, Korea",
    website: "www.example.com",
    greeting: "स्वागत छ! Welcome!",
    s1: "Nepali home cooking",
    s2: "Catering for events",
    s3: "Halal friendly menu"
  }
};
/*__CFG_END__*/
(function(){
  try {
    var m = location.hash.match(/[#&]d=([^&]+)/); if (!m) return;
    var b64 = m[1].replace(/-/g, "+").replace(/_/g, "/"); while (b64.length % 4) b64 += "=";
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var d = JSON.parse(new TextDecoder().decode(bytes));
    ["studio","niche","language","accent","sample","font","logoShape"].forEach(function(k){ if (d[k] !== undefined && d[k] !== "") CFG[k] = d[k]; });
    if (d.card) Object.keys(d.card).forEach(function(k){ CFG.card[k] = d.card[k]; });
  } catch (e) {}
})();
</script>
<header>
  <h1 id="appTitle">Name Card Maker</h1>
  <p>Make a name card in 1 minute</p>
  <span class="badge">Practice project, not for sale</span>
</header>
<main>
  <section class="panel" aria-label="Card details">
    <h2>Business</h2>
    <label for="logo">Logo image (optional)</label>
    <input id="logo" type="file" accept="image/*">
    <label for="business">Business name</label>
    <input id="business" type="text">
    <label for="businessLocal" id="localLabel">Business name in my customers' language</label>
    <input id="businessLocal" type="text">
    <label for="website">Website</label>
    <input id="website" type="text">

    <h2>Person</h2>
    <div class="row">
      <div><label for="name">Name</label><input id="name" type="text"></div>
      <div><label for="title">Job title</label><input id="title" type="text"></div>
    </div>

    <h2>Contact</h2>
    <div class="row">
      <div><label for="mobile">Mobile</label><input id="mobile" type="text"></div>
      <div><label for="email">Email</label><input id="email" type="email"></div>
    </div>
    <label for="address">Address</label>
    <input id="address" type="text">

    <h2>Back of the card</h2>
    <label for="s1">Service 1</label><input id="s1" type="text">
    <label for="s2">Service 2</label><input id="s2" type="text">
    <label for="s3">Service 3</label><input id="s3" type="text">
    <label for="greeting">Welcome line</label><input id="greeting" type="text">

    <h2>Design</h2>
    <div class="samples" id="samples"></div>
    <label>Colors</label>
    <div class="color-row">
      <span class="note">Background</span><input id="bg" type="color">
      <span class="note">Accent</span><input id="accent" type="color">
    </div>
    <label>Logo symbol</label>
    <div class="logos" id="logos"></div>
    <label for="font">Font</label>
    <select id="font">
      <option value="Montserrat">Modern Sans (Montserrat)</option><option value="Playfair Display">Classic Serif (Playfair Display)</option><option value="Poppins">Friendly Round (Poppins)</option><option value="JetBrains Mono">Tech Mono (JetBrains Mono)</option>
    </select>
    <label for="photo">Background photo (optional)</label>
    <input id="photo" type="file" accept="image/*">
    <label for="opacity">Photo strength</label>
    <input id="opacity" type="range" min="0" max="60" value="18">
  </section>

  <section class="preview" aria-label="Card preview">
    <div class="cards">
      <figure><figcaption>Front</figcaption><canvas id="front" width="1063" height="591"></canvas></figure>
      <figure><figcaption>Back</figcaption><canvas id="back" width="1063" height="591"></canvas></figure>
    </div>
    <div class="btns">
      <button class="main" id="saveFront">Save front PNG</button>
      <button class="main" id="saveBack">Save back PNG</button>
      <button id="saveBoth">Save both in one PNG</button>
      <button id="saveVcf">Save contact (vCard)</button>
      <button id="saveQr">Save QR PNG</button>
    </div>
    <div id="fallback" role="status">
      <strong>Right click (computer) or press and hold (phone) to save.</strong>
      <div id="fallbackText" class="note"></div>
      <img id="fallbackImg" alt="Your saved image">
    </div>
    <p class="note" id="qrNote"></p>
  </section>
</main>
<footer>Your information stays in your browser. Contact details in the example are fictional.</footer>

<script>
(function(){
var W = 1063, H = 591;
var $ = function(id){ return document.getElementById(id); };
var fields = ["business","businessLocal","website","name","title","mobile","email","address","s1","s2","s3","greeting"];
var state = { sample: +CFG.sample || 1, bg: "#FFFFFF", accent: CFG.accent || "#8B1E2D", font: (["Montserrat","Playfair Display","Poppins","JetBrains Mono"].indexOf(CFG.font) >= 0 ? CFG.font : "Montserrat"), logoShape: CFG.logoShape || "circle", logo: null, photo: null, opacity: 18 };

var SAMPLES = [
  {id:1, name:"Classic", bg:"#FFFFFF"},
  {id:2, name:"Center",  bg:"#FBF8F3"},
  {id:3, name:"Split",   bg:"#FFFFFF"},
  {id:4, name:"Minimal", bg:"#FFFFFF"},
  {id:5, name:"Bold",    bg:null},
  {id:6, name:"Corner",  bg:"#F7F4EF"}
];

function lum(hex){
  var h = hex.replace("#",""); if (h.length === 3) h = h.split("").map(function(c){return c+c;}).join("");
  var r = parseInt(h.substr(0,2),16)/255, g = parseInt(h.substr(2,2),16)/255, b = parseInt(h.substr(4,2),16)/255;
  var f = function(v){ return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); };
  return 0.2126*f(r) + 0.7152*f(g) + 0.0722*f(b);
}
function inkOn(hex){ return lum(hex) > 0.45 ? "#1D1B19" : "#FFFFFF"; }
function fontStack(){ return '"' + state.font + '", "Noto Sans Devanagari", "Noto Sans KR", "Noto Sans", sans-serif'; }
function setFont(x, size, weight){ x.font = (weight || 400) + " " + size + "px " + fontStack(); }
function fit(x, text, maxW, size, weight){
  var s = size; setFont(x, s, weight);
  while (x.measureText(text).width > maxW && s > 12){ s -= 1; setFont(x, s, weight); }
  return s;
}
function txt(x, text, X, Y, maxW, size, weight, color, align){
  if (!text) return;
  x.fillStyle = color; x.textAlign = align || "left"; x.textBaseline = "alphabetic";
  fit(x, text, maxW, size, weight); x.fillText(text, X, Y);
}
function initials(n){
  var p = String(n||"").trim().split(/\s+/).filter(Boolean);
  return (p.slice(0,2).map(function(w){return w.charAt(0);}).join("") || "MY").toUpperCase();
}
function v(id){ return ($(id).value || "").trim(); }

function shapePath(x, shape, cx, cy, r, fill){
  x.fillStyle = fill;
  if (shape === "square"){
    var a = r * 1.2;
    x.globalAlpha = 0.55; x.fillRect(cx - a*0.95, cy - a*0.95, a*1.35, a*1.35);
    x.globalAlpha = 1; x.fillRect(cx - a*0.4, cy - a*0.4, a*1.35, a*1.35);
    return;
  }
  x.beginPath();
  if (shape === "hexagon"){
    for (var i = 0; i < 6; i++){ var t = Math.PI/6 + i*Math.PI/3; x[i ? "lineTo" : "moveTo"](cx + r*Math.cos(t), cy + r*Math.sin(t)); }
    x.closePath();
  } else if (shape === "diamond"){
    x.moveTo(cx, cy - r*1.1); x.lineTo(cx + r*1.1, cy); x.lineTo(cx, cy + r*1.1); x.lineTo(cx - r*1.1, cy); x.closePath();
  } else { x.arc(cx, cy, r, 0, Math.PI*2); }
  x.fill();
}
var LOGOS = [["square","Square Overlap"],["hexagon","Hexagon"],["circle","Circle"],["diamond","Diamond"]];
function buildLogos(){
  var box = $("logos");
  LOGOS.forEach(function(l){
    var b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-label", "Logo symbol: " + l[1]);
    var c = document.createElement("canvas"); c.width = 88; c.height = 88;
    var cx = c.getContext("2d"); shapePath(cx, l[0], 44, 44, 30, state.accent);
    var sp = document.createElement("span"); sp.textContent = l[1];
    b.appendChild(c); b.appendChild(sp);
    if (l[0] === state.logoShape) b.classList.add("on");
    b.addEventListener("click", function(){ state.logoShape = l[0]; [].forEach.call(box.children, function(el){ el.classList.remove("on"); }); b.classList.add("on"); render(); renderThumbs(); });
    box.appendChild(b);
  });
}
function drawLogo(x, cx, cy, r, fill, ink){
  if (state.logo){
    var img = state.logo, s = Math.min(r*2/img.width, r*2/img.height);
    var w = img.width*s, h = img.height*s;
    x.drawImage(img, cx - w/2, cy - h/2, w, h);
    return;
  }
  shapePath(x, state.logoShape, cx, cy, r, fill);
  x.fillStyle = ink; x.textAlign = "center"; x.textBaseline = "middle";
  fit(x, initials(v("business")), r*1.5, r*0.85, 800); x.fillText(initials(v("business")), cx, cy + 2);
  x.textBaseline = "alphabetic";
}
function drawPhoto(x, w, h){
  if (!state.photo || state.opacity <= 0) return;
  var img = state.photo, s = Math.max(w/img.width, h/img.height);
  x.save(); x.globalAlpha = state.opacity/100;
  x.drawImage(img, (w - img.width*s)/2, (h - img.height*s)/2, img.width*s, img.height*s);
  x.restore();
}

function drawFront(cv, sample, small){
  var x = cv.getContext("2d"), w = cv.width, h = cv.height, k = w / W;
  x.setTransform(k,0,0,k,0,0);
  var A = state.accent, bg = (sample === 5) ? A : state.bg, ink = inkOn(bg), soft = (ink === "#FFFFFF") ? "rgba(255,255,255,.75)" : "rgba(0,0,0,.55)";
  x.fillStyle = bg; x.fillRect(0,0,W,H);
  drawPhoto(x, W, H);
  var B = v("business"), BL = v("businessLocal"), N = v("name"), T = v("title");
  if (sample === 1){
    x.fillStyle = A; x.fillRect(0, H-26, W, 26);
    drawLogo(x, 120, 130, 62, A, inkOn(A));
    txt(x, B, 210, 132, 780, 66, 800, ink);
    txt(x, BL, 210, 188, 780, 38, 600, A);
    txt(x, N, 70, 440, 900, 64, 700, ink);
    txt(x, T, 70, 495, 900, 36, 400, soft);
  } else if (sample === 2){
    x.fillStyle = A; x.fillRect(0,0,W,14); x.fillRect(0,H-14,W,14);
    drawLogo(x, W/2, 140, 66, A, inkOn(A));
    txt(x, B, W/2, 285, 900, 56, 800, ink, "center");
    txt(x, BL, W/2, 335, 900, 32, 600, A, "center");
    x.fillStyle = A; x.fillRect(W/2-60, 368, 120, 4);
    txt(x, N, W/2, 445, 900, 46, 700, ink, "center");
    txt(x, T, W/2, 492, 900, 28, 400, soft, "center");
  } else if (sample === 3){
    var sw = 400; x.fillStyle = A; x.fillRect(0,0,sw,H);
    var ia = inkOn(A);
    drawLogo(x, sw/2, 190, 74, ia, A);
    txt(x, B, sw/2, 340, 340, 40, 800, ia, "center");
    txt(x, BL, sw/2, 388, 340, 28, 600, ia, "center");
    txt(x, N, sw+60, 270, W-sw-100, 56, 700, ink);
    txt(x, T, sw+60, 320, W-sw-100, 30, 400, A);
  } else if (sample === 4){
    txt(x, N, 80, 250, 900, 72, 800, ink);
    txt(x, T, 80, 305, 900, 32, 400, soft);
    x.fillStyle = A; x.fillRect(80, 350, 140, 5);
    txt(x, B, 80, 450, 700, 40, 700, A);
    txt(x, BL, 80, 498, 700, 28, 400, soft);
    drawLogo(x, W-130, H-130, 56, A, inkOn(A));
  } else if (sample === 5){
    drawLogo(x, 130, 140, 66, ink, bg);
    txt(x, B, 230, 135, 780, 58, 800, ink);
    txt(x, BL, 230, 188, 780, 32, 600, soft);
    x.fillStyle = ink; x.fillRect(70, 330, 80, 5);
    txt(x, N, 70, 430, 900, 56, 700, ink);
    txt(x, T, 70, 482, 900, 30, 400, soft);
  } else {
    x.beginPath(); x.arc(W, 0, 300, 0, Math.PI*2); x.fillStyle = A; x.fill();
    x.beginPath(); x.arc(0, H, 120, 0, Math.PI*2); x.globalAlpha = .25; x.fill(); x.globalAlpha = 1;
    drawLogo(x, W-130, 120, 58, inkOn(A), A);
    txt(x, B, 70, 150, 700, 56, 800, ink);
    txt(x, BL, 70, 200, 700, 32, 600, A);
    txt(x, N, W-70, 440, 800, 52, 700, ink, "right");
    txt(x, T, W-70, 490, 800, 30, 400, soft, "right");
  }
  x.setTransform(1,0,0,1,0,0);
}

var qrImg = null;
function vcardText(){
  return ["BEGIN:VCARD","VERSION:3.0","FN:"+v("name"),"ORG:"+v("business"),"TITLE:"+v("title"),
    "TEL;TYPE=CELL:"+v("mobile"),"EMAIL:"+v("email"),"URL:"+v("website"),"ADR:;;"+v("address")+";;;;","END:VCARD"].join("\n");
}
function makeQr(done){
  qrImg = null;
  try {
    if (typeof qrcode === "undefined") throw new Error("nolib");
    qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
    var q = qrcode(0, "M"); q.addData(vcardText()); q.make();
    var n = q.getModuleCount(), cell = Math.max(2, Math.floor(360 / n)), c = document.createElement("canvas");
    c.width = c.height = n * cell; var x = c.getContext("2d");
    x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height); x.fillStyle = "#000";
    for (var r = 0; r < n; r++) for (var k = 0; k < n; k++) if (q.isDark(r,k)) x.fillRect(k*cell, r*cell, cell, cell);
    qrImg = c; $("qrNote").textContent = "";
  } catch(e) { $("qrNote").textContent = "The QR code could not be made. Make the address or website shorter."; }
  done();
}
function drawBack(cv){
  var x = cv.getContext("2d"), k = cv.width / W;
  x.setTransform(k,0,0,k,0,0);
  var A = state.accent, ink = inkOn(A), soft = (ink === "#FFFFFF") ? "rgba(255,255,255,.8)" : "rgba(0,0,0,.6)";
  x.fillStyle = A; x.fillRect(0,0,W,H);
  var qrX = W - 70 - 250;
  x.fillStyle = "#FFFFFF"; x.fillRect(qrX - 14, 66, 278, 278);
  if (qrImg) { x.imageSmoothingEnabled = false; x.drawImage(qrImg, qrX, 80, 250, 250); x.imageSmoothingEnabled = true; }
  txt(x, "Scan to save my contact", qrX + 125, 380, 280, 24, 400, soft, "center");
  var sv = [v("s1"), v("s2"), v("s3")].filter(Boolean), y = 120;
  sv.forEach(function(s){ x.fillStyle = ink; x.fillRect(70, y-16, 12, 12); txt(x, s, 100, y, qrX - 140, 44, 700, ink); y += 62; });
  x.fillStyle = soft; x.fillRect(70, 300, qrX - 120, 3);
  var lines = [v("mobile"), v("email"), v("website"), v("address")].filter(Boolean); y = 350;
  lines.forEach(function(s){ txt(x, s, 70, y, qrX - 120, 32, 400, ink); y += 42; });
  txt(x, v("greeting"), 70, H - 40, qrX - 100, 38, 700, ink);
  x.setTransform(1,0,0,1,0,0);
}

function render(){
  drawFront($("front"), state.sample);
  makeQr(function(){ drawBack($("back")); });
}
function renderThumbs(){
  SAMPLES.forEach(function(s){
    var c = document.getElementById("thumb"+s.id); if (!c) return;
    drawFront(c, s.id, true);
  });
}
function buildSamples(){
  var box = $("samples");
  SAMPLES.forEach(function(s){
    var b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-label", "Sample " + s.id + ": " + s.name);
    var c = document.createElement("canvas"); c.width = 213; c.height = 118; c.id = "thumb" + s.id;
    var sp = document.createElement("span"); sp.textContent = s.id + ". " + s.name;
    b.appendChild(c); b.appendChild(sp);
    b.addEventListener("click", function(){
      state.sample = s.id; if (s.bg) { state.bg = s.bg; $("bg").value = s.bg; }
      [].forEach.call(box.children, function(el){ el.classList.remove("on"); }); b.classList.add("on");
      render(); renderThumbs();
    });
    if (s.id === state.sample) b.classList.add("on");
    box.appendChild(b);
  });
}
function loadImage(file, cb){
  if (!file) { cb(null); return; }
  var r = new FileReader();
  r.onload = function(){ var im = new Image(); im.onload = function(){ cb(im); }; im.src = r.result; };
  r.readAsDataURL(file);
}
function showFallback(url, text){
  $("fallback").style.display = "block"; $("fallbackImg").src = url; $("fallbackText").textContent = text || "";
}
function download(url, filename, isImage){
  try {
    var a = document.createElement("a"); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
  } catch(e) {}
  if (isImage) showFallback(url, "If the download did not start, save this image: " + filename);
}
function safeName(){ return (v("business") || "namecard").replace(/[^a-z0-9]+/gi, "_").replace(/^_|_$/g,"") || "namecard"; }
function hiRes(drawFn){
  var c = document.createElement("canvas"); c.width = W; c.height = H; drawFn(c); return c;
}

function ready(fn){ loadFonts().then(fn, fn); }
$("saveFront").onclick = function(){ ready(function(){ download(hiRes(function(c){ drawFront(c, state.sample); }).toDataURL("image/png"), safeName() + "_front.png", true); }); };
$("saveBack").onclick = function(){ ready(function(){ download(hiRes(drawBack).toDataURL("image/png"), safeName() + "_back.png", true); }); };
$("saveBoth").onclick = function(){ ready(function(){
  var f = hiRes(function(c){ drawFront(c, state.sample); }), b = hiRes(drawBack);
  var o = document.createElement("canvas"), pad = 40; o.width = W*2 + pad*3; o.height = H + pad*2;
  var x = o.getContext("2d"); x.fillStyle = "#ECE8E3"; x.fillRect(0,0,o.width,o.height);
  x.drawImage(f, pad, pad); x.drawImage(b, W + pad*2, pad);
  download(o.toDataURL("image/png"), safeName() + "_card.png", true);
}); };
$("saveVcf").onclick = function(){
  var blob = new Blob([vcardText()], {type: "text/vcard"});
  var url = URL.createObjectURL(blob);
  download(url, safeName() + ".vcf", false);
  $("fallback").style.display = "block"; $("fallbackImg").removeAttribute("src");
  $("fallbackText").textContent = "If the contact file did not download, open this page from its own web address (not inside another app) and try again.";
};
$("saveQr").onclick = function(){
  if (!qrImg) { $("qrNote").textContent = "No QR code yet."; return; }
  var c = document.createElement("canvas"); c.width = 440; c.height = 440;
  var x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,440,440); x.imageSmoothingEnabled = false; x.drawImage(qrImg, 40, 40, 360, 360);
  download(c.toDataURL("image/png"), safeName() + "_qr.png", true);
};

fields.forEach(function(f){ var el = $(f); el.value = (CFG.card && CFG.card[f]) || ""; el.addEventListener("input", function(){ render(); renderThumbs(); }); });
$("appTitle").textContent = (CFG.studio || "My") + " Name Card Maker";
document.title = $("appTitle").textContent;
$("localLabel").textContent = "Business name in " + (CFG.language || "my customers' language");
document.documentElement.style.setProperty("--accent", state.accent);
$("accent").value = state.accent;
var s0 = SAMPLES.filter(function(s){ return s.id === state.sample; })[0];
state.bg = (s0 && s0.bg) || "#FFFFFF"; $("bg").value = state.bg;
$("font").value = state.font;
$("bg").addEventListener("input", function(){ state.bg = this.value; render(); renderThumbs(); });
$("accent").addEventListener("input", function(){ state.accent = this.value; document.documentElement.style.setProperty("--accent", this.value); render(); renderThumbs(); });
$("font").addEventListener("change", function(){ state.font = this.value; loadFonts().then(function(){ render(); renderThumbs(); }); });
$("opacity").addEventListener("input", function(){ state.opacity = +this.value; render(); renderThumbs(); });
$("logo").addEventListener("change", function(){ loadImage(this.files[0], function(im){ state.logo = im; render(); renderThumbs(); }); });
$("photo").addEventListener("change", function(){ loadImage(this.files[0], function(im){ state.photo = im; render(); renderThumbs(); }); });

function loadFonts(){
  if (!document.fonts || !document.fonts.load) return Promise.resolve();
  var fams = [state.font, "Noto Sans Devanagari", "Noto Sans KR"];
  return Promise.all(fams.map(function(f){ return Promise.all([document.fonts.load('400 40px "' + f + '"'), document.fonts.load('800 40px "' + f + '"'), document.fonts.load('700 40px "' + f + '"')]).catch(function(){}); }))
    .then(function(){ return document.fonts.ready; }).catch(function(){});
}
window.addEventListener("hashchange", function(){ location.reload(); });
buildSamples();
buildLogos();
render(); renderThumbs();
loadFonts().then(function(){ render(); renderThumbs(); });
setTimeout(function(){ render(); renderThumbs(); }, 1500);
})();
</script>
</body>
</html>
